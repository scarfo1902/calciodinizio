und:var(--card);color:var(--pri);display:flex;align-items:center;justify-content:center} .acc{width:calc(100% - 24px);margin:8px 12px 0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;font-size:15px;text-align:left} .acc small{font-weight:500;color:var(--mut);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .fsec{display:flex;flex-direction:column;gap:8px;margin-top:14px} .fsec>span{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px} .fsec .card{margin:0!important} .fsec .pills.sc{padding:0!important} .nav .ni svg{display:block} .fc .fsl{font-size:9.5px;font-weight:800;letter-spacing:.4px;line-height:1;opacity:.85;text-shadow:0 1px 2px #000b} .fc em.pn{color:#ffd23f;font-weight:800;font-size:10.5px;text-shadow:0 1px 2px #000b} .fc em.pn.hi{color:#ff9a8f}

 const won=u.ch==me,el=!won&&(u.dn||!!(T&&T.w>=0&&T.w!=me)),lv=won?5:i>=L-1?4:i==L-2?3:i==L-3?2:i==L-4?1:0,nm=j=>d.R[Math.max(0,Math.min(j,L-1))].n;

 R.push({kd:'lg',k:ob.lg.k,ic:'🏆',lab:'Campionato · '+LG[l].k,tx:LGX[ob.lg.k](O),pp:pzLg(l,ob.lg.k)});

// stato di ogni obiettivo: st = ok (raggiunto / in linea) · up (superato) · ko (mancato / in ritardo) · wip (in corso) · no (nessun obiettivo). pz = premio, solo a stagione chiusa
obEv=ob=>{const me=S.me,l=ob.l,LV=lgLv(l,ob.lg.k=='mid'?ob.lg.m:0);
 return obPlan(ob).map(r=>{let st,sx,pz=0,dn=0,sl,gv=0,tg=1;
  if(r.kd=='lg'){const tb=table(l),pos=tb.findIndex(x=>x.id==me),row=tb[pos],oi=LV.findIndex(e=>e.k==ob.lg.k),O=oi>=0?LV[oi]:ob.lg;let ai=LV.findIndex(e=>pos+1<=e.m),vc=0;dn=S.round>=S.lgs[l].n?1:0;
   // vincere la coppa nazionale vale un posto in Europa
   Object.values(S.cp||{}).forEach(u=>{if(!u.eu&&u.dn&&u.ch==me){const d=cuDef(u),j=LV.findIndex(e=>e.k==(d.eu=='UEL'?'el':'ec'));if(j>=0&&(ai<0||j<ai)){ai=j;vc=1}}});
   const ok=pos+1<=O.m||(oi>=0&&ai>=0&&ai<=oi),up=oi>=0&&ai>=0&&ai<oi;const ex=ob.r!=null?ob.r+1:0,GL=Math.max(3,Math.ceil(tb.length/6));gv=!ok&&(ob.lg.k=='sa'&&(!ex||ex<=O.m)||pos+1-Math.max(O.m,ex)>=GL)?1:0;
   if(dn){st=up?'up':ok?'ok':'ko';sx='Chiuso al '+(pos+1)+'° posto con '+row.pt+' punti'+(vc&&ai<=oi?' (posto europeo conquistato in coppa)':'');if(st=='ok')pz=r.pp;else if(st=='up')pz=r1(pzLg(l,LV[ai].k)*1.25)}
   else{st=ok?'ok':'ko';const g=!ok&&tb[O.m-1]?Math.max(0,tb[O.m-1].pt-row.pt):0;sx=(pos+1)+'° con '+row.pt+' punti'+(ok?'':' · il '+O.m+'° posto dista '+g+(g==1?' punto':' punti'))}}
  else{const u=S.cp&&S.cp[r.k],c=r.kd=='cu'?cuByK(r.k):0;
   if(!u)return Object.assign(r,{st:'no',sx:'—',pz:0,dn:0,sl:'',i:'➖'});
   const my=r.kd=='cu'?cuMy(u):euMy(u),need=r.kd=='cu'?NLV.indexOf(ob.cu[r.k]):ELV.indexOf(ob.eu.x),ach=my.lv;dn=my.out||u.dn?1:0;sx=my.sx;
   if(need>0)st=dn?(ach>need?'up':ach==need?'ok':'ko'):(ach>=need?'ok':'wip');else st=ach>0?'up':'no';gv=st=='ko'&&need-ach>=3?1:0;tg=need>0?1:0;
   if(dn&&st=='ok')pz=r.pp;else if(dn&&st=='up')pz=r1((r.kd=='cu'?pzCu(c.ci,NLV[ach]):pzEu(r.k,ELV[ach]))*1.25)}
  sl=dn?{up:'superato',ok:'raggiunto',ko:'mancato',no:'nessun obiettivo'}[st]:{ok:'in linea',ko:'in ritardo',wip:'in corso',up:'sorpresa!',no:'nessun obiettivo'}[st];
  return Object.assign(r,{st,sx,pz,dn,sl,g:gv,tg,i:dn?{up:'🌟',ok:'✅',ko:'❌',no:'➖'}[st]:{ok:'✅',ko:'⚠️',wip:'⏳',up:'🌟',no:'➖'}[st]})})},

['r','Rigorista','R','Calcia i rigori. Conta il suo voto rispetto a quello del portiere avversario: 76% di gol a pari voto, 4 punti percentuali in più o in meno ogni 10 punti di differenza (minimo 55%, massimo 92%). Qualsiasi giocatore di movimento; se non scegli nessuno, il mister sceglie il voto più alto fra i titolari.','è il nuovo rigorista'],

/* ===== v0.5.4.2: specialisti in campo (fase 2), rigori e punizioni «a suspense», filtri Rosa/Mercato separati =====
   Capitano: coesione da 0 a +1,0 alla forza dell'undici (anni 27 → +0,5; 35 → +1,0), 60% se la fascia è passata a un altro.
   Rigori, punizioni e angoli: tira chi è stato scelto (o, in automatico, il migliore fra i titolari). Le probabilità di gol NON cambiano:
   cambia solo chi segna e come viene raccontato. Rigore e punizione sono sequenze a tre tempi: fallo → chi batte → esito.
   Filtri: la Rosa usa ui.rrole / ui.rage / ui.rkind, il Mercato ui.role / ui.age / ui.kind. */
const FLW={pk:{DIF:5,CEN:3,ATT:.8,POR:.7},fk:{DIF:4,CEN:4,ATT:1.5,POR:0}},
LVWH=['al limite dell’area','a 25 metri dalla porta','in posizione invitante','appena fuori dall’area','sulla trequarti'],

spTk=(t,xi,k)=>{xi=(xi||[]).filter(Boolean);return t&&t.id==S.me?spAll(xi,1)[k]||null:spBest(k,xi)},
// coesione del capitano: dipende dall'esperienza; senza un capitano idoneo (27 anni, non appena arrivato) non c'è
spCoh=(t,xi)=>{xi=(xi||[]).filter(Boolean);const me=t&&t.id==S.me,c=me?spAll(xi,1).c:spBest('c',xi);if(!c||!spOk('c',c))return 0;const d=me?spAll(xi,0).c:c;return espOf(c)/100*(d===c?1:.6)*(c.hp!=null&&c.hp<35?.5:1)},

lvTaker=(T,k)=>spTk(T.t,T.x,k),
lvCapOf=T=>spTk(T.t,T.x,'c'),
lvCode=t=>`<span class='mu' style='font-size:12px'>(${t})</span>`;
// sequenze in più tempi (una alla volta); l'esito si decide al momento del tiro, in base a chi tira davvero e al portiere: ogni passo va in scena in un tick; se non c'è più tempo (fine del tempo o della partita) o si sta simulando, tutto subito
function lvSq(v,s,c,e){const O=v.T[s=='h'?'a':'h'],W=FLW[e.ty],ps=O.x.filter(q=>q&&W[q.r]>0);Object.assign(e,{s,st:0,fl:ps.length?WP(ps,q=>W[q.r]):null});
 const lim=v.k<=45+v.st1?45+v.st1:(v.end||v.tot),now=v.sk||v.k+2>lim;lvStep(v,c,e);

function lvQ(v,c){if(!v.q||!v.q.length)return;v.q.filter(e=>e.at<=v.k).forEach(e=>{lvStep(v,c,e);if(e.st>=3)v.q.splice(v.q.indexOf(e),1);else e.at=v.k+1})}
function lvStep(v,c,e){const s=e.s,T=v.T[s],O=v.T[s=='h'?'a':'h'],tn=T.t.name,pk=e.ty=='pk',st=e.st++;
 if(st==0){const F=e.fl?lvSur(e.fl)+' '+lvCode(O.t.code):'un difensore',V=lvSur(e.p);
  lvF(v,c,s,pk?'🚨':'🚩',pk?pick([`<b>Rigore per ${tn}!</b> ${F} atterra ${V} in area`,`Fallo in area di ${F} su ${V}: <b>calcio di rigore per ${tn}</b>`,`Mani in area di ${F}: l’arbitro indica il dischetto, <b>rigore per ${tn}</b>`,`${F} trattiene ${V} in area e l’arbitro fischia: <b>è rigore per ${tn}</b>`]):pick([`Punizione per ${tn}: ${F} ferma ${V} ${pick(LVWH)}`,`Fallo di ${F} su ${V} ${pick(LVWH)}: punizione per ${tn}`]),pk?'k':'');return}
 const gk=O.x.find(q=>q&&q.r=='POR'),g=gk?lvSur(gk):'il portiere';
 if(st==1){e.tk=lvTaker(T,pk?'r':'p')||e.p;const K=lvSur(e.tk),tc=lvCode(T.t.code);
  lvF(v,c,s,spBg(pk?'r':'p',pk?'R':'P'),pk?pick([`Sul dischetto va <b>${K}</b> ${tc}: ${g} si prepara a tuffarsi`,`${K} ${tc} sistema il pallone sul dischetto: silenzio sugli spalti`,`Si incarica del tiro <b>${K}</b> ${tc}, lo stadio trattiene il fiato`,`<b>${K}</b> ${tc} prende il pallone: rincorsa breve, ${g} lo fissa`]):pick([`Sul pallone va <b>${K}</b> ${tc}: ${g} sistema la barriera`,`Batte <b>${K}</b> ${tc}, la barriera è piazzata`,`<b>${K}</b> ${tc} si prende la punizione: pochi passi di rincorsa`,`Il pubblico si zittisce: batte <b>${K}</b> ${tc}`]));return}
 let tk=e.tk,pre='';if(!T.x.includes(tk)){const n=lvTaker(T,pk?'r':'p');if(n&&n!==tk){pre=`${lvSur(tk)} non è più in campo: batte ${lvSur(n)}. `;tk=n}}
 if(e.goal==null)e.goal=Math.random()<(pk?spPk(tk,gk):spFk(tk,gk))?1:0;
 if(e.goal){v[s=='h'?'hg':'ag']++;v.on[s]++;v.sc[s].push([c.m,tk.n,tk,null,pk,!pk]);
  lvF(v,c,s,'⚽',`${pre}<b>GOL ${tn}!</b> ${pk?'Rigore trasformato da ':pick(['Punizione vincente di ','Punizione magistrale di ','Su punizione, '])}<b>${lvSur(tk)}</b>. <b>${v.hg}–${v.ag}</b>`,'g')}
 else if(pk)lvMiss(v,s,c,tk,pre);else lvOut(v,s,c,e.y??Math.random(),{p:tk,ori:'fk',pre})}
// tiro che non diventa gol: y decide l'esito (parata, alto, palo, salvataggio sulla linea, murato); ori = azione normale, angolo o punizione
function lvOut(v,s,c,y,o){const T=v.T[s],O=v.T[s=='h'?'a':'h'],gk=O.x.find(q=>q&&q.r=='POR'),ds=O.x.filter(q=>q&&q.r=='DIF'),df=ds.length?pick(ds):null,sn=lvSur(o.p),tc=lvCode(T.t.code),g=gk?lvSur(gk):'il portiere',d=df?lvSur(df):'La difesa',fk=o.ori=='fk',co=o.ori=='co',ct=co?lvSur(o.ct):'';let ic,tx;
 if(y<.38){v.on[s]++;if(gk)(v.sv=v.sv||{h:0,a:0})[s=='h'?'a':'h']++;ic='🧤';tx=fk?`Parata di ${g} sulla punizione di ${sn} ${tc}`:co?`Angolo di ${ct}: ${sn} ${tc} di testa, para ${g}`:`Parata di ${g} su ${sn} ${tc}`}
 else if(y<.66){ic='💨';tx=fk?`La punizione di ${sn} ${tc} ${pick(['scavalca la traversa','termina alta di poco','sfila a lato'])}`:co?`Angolo di ${ct}: ${sn} ${tc} di testa ${pick(['sopra la traversa','a lato','fuori di poco'])}`:`${sn} ${tc} ${pick(['calcia alto sopra la traversa','manca di poco il palo','tira a lato da buona posizione','non inquadra la porta'])}`}
 else if(y<.76){ic='🥅';tx=fk?`<b>Palo!</b> La punizione di ${sn} ${tc} si stampa sul legno`:co?`<b>Palo!</b> Sull’angolo di ${ct} ${sn} ${tc} colpisce di testa il legno`:`<b>Palo!</b> ${sn} ${tc} sfiora il gol`}
 else if(y<.9){ic='🛡';tx=fk?`${sn} ${tc} calcia sulla barriera`:co?`Angolo di ${ct}: ${d} salva sulla linea su ${sn} ${tc}`:`${d} salva sulla linea su ${sn} ${tc}`}
 else{ic='🧱';tx=fk?`La barriera respinge la punizione di ${sn} ${tc}`:co?`Angolo di ${ct}: il colpo di ${sn} ${tc} è murato dalla difesa`:`Tiro di ${sn} ${tc} murato dalla difesa`}
 lvF(v,c,s,ic,(o.pre||'')+tx)}
function lvChance(v,s,goal,c){const T=v.T[s],X=T.x.filter(Boolean);if(!X.length)return;const w=X.map(p=>ROLW[p.r]),tot=w.reduce((a,b)=>a+b,0);let u=Math.random()*tot,j=0;while(j<X.length-1&&u>w[j]){u-=w[j];j++}const p=X[j],tn=T.t.name,cd=X.filter(q=>q!==p&&q.r!='POR'),ct=lvTaker(T,'a');v.sh[s]++;
 if(goal){
  let a=null,cor=0;if(cd.length&&Math.random()<.7){if(Math.random()<.14&&ct&&ct!==p){a=ct;cor=1}else a=pick(cd)}
  v[s=='h'?'hg':'ag']++;v.on[s]++;v.sc[s].push([c.m,p.n,p,a,false,false]);lvF(v,c,s,'⚽',`<b>GOL ${tn}!</b> <b>${lvSur(p)}</b>${cor?' di testa sull’angolo battuto da '+lvSur(a):a?', assist di '+lvSur(a):''}. <b>${v.hg}–${v.ag}</b>`,'g');return}
 lvOut(v,s,c,Math.random(),{p,ori:Math.random()<.08&&ct&&ct!==p?'co':'op',ct})}
// la fascia passa a un altro (il capitano esce o rientra il capitano designato)
function lvCap(v,c){['h','a'].forEach(s=>{const T=v.T[s],cp=lvCapOf(T);if(T.cp===undefined){T.cp=cp;return}if(cp&&cp!==T.cp){T.cp=cp;lvF(v,c,s,spBg('c','C'),`${T.t.name}: la fascia di capitano passa a <b>${lvSur(cp)}</b>`)}})}

/* ===== v0.5.4.4: rigori e punizioni legati al voto di chi tira, rigori sbagliati =====
   Rigori e punizioni non nascono più «già gol»: sono episodi a parte, e l'esito dipende da tiratore e portiere.
   Per ogni gol atteso (lam): SPO gol su azione, SPR rigori assegnati, SPF punizioni dirette calciate.
   Rigore: 76% a pari voto, ±0,4% per ogni punto di differenza fra tiratore e portiere (55%–92%).
   Punizione: 6,5% a pari voto, ±0,25% per punto di differenza (2%–12%).
   Il totale dei gol resta quello di prima: SPO + SPR×(media rigori) + SPF×(media punizioni) ≈ 1.
   Rigore sbagliato: evento «M» nel tabellino e contatore p.px; nessun malus su voto o umore. */
const SPO=.85,SPR=.128,SPF=.66,
spCl=(v,a,b)=>Math.max(a,Math.min(b,v)),
spPk=(tk,gk)=>gk&&tk?spCl(.76+(tk.o-gk.o)*.004,.55,.92):.92,
spFk=(tk,gk)=>gk&&tk?spCl(.065+(tk.o-gk.o)*.0025,.02,.12):.12,
// simulazione rapida: gol di una squadra = azione + rigori segnati + punizioni segnate; il dettaglio resta sulla formazione (L.sq) per i marcatori
simG=(L,O,lam)=>{const gk=(O.x||[]).find(p=>p&&p.r=='POR'),t={id:L.tid},pp=spPk(spTk(t,L.x,'r'),gk),n1=poi(lam*SPR*pp),n0=poi(lam*SPR*(1-pp)),nf=poi(lam*SPF*spFk(spTk(t,L.x,'p'),gk)),q=L.sq||(L.sq={pk:0,pm:0,fk:0});q.pk+=n1;q.pm+=n0;q.fk+=nf;return poi(lam*SPO)+n1+nf};
// partita live: a ogni minuto può nascere un rigore o una punizione diretta (uno alla volta)
function lvSet(v,s,lam,c){if(v.q&&v.q.length)return;const u=Math.random(),ty=u<lam*SPR?'pk':u<lam*(SPR+SPF)?'fk':0;if(!ty)return;const X=v.T[s].x.filter(q=>q&&q.r!='POR');if(!X.length)return;v.sh[s]++;lvSq(v,s,c,{ty,p:WP(X,q=>ROLW[q.r]),y:Math.random()})}
// rigore non segnato: parato (6 su 10) oppure fuori / sul palo
function lvMiss(v,s,c,tk,pre){const T=v.T[s],O=v.T[s=='h'?'a':'h'],gk=O.x.find(q=>q&&q.r=='POR'),K=lvSur(tk)+' '+lvCode(T.t.code),sv=gk&&Math.random()<.6;if(sv){v.on[s]++;(v.sv=v.sv||{h:0,a:0})[s=='h'?'a':'h']++}v.ev[s].push({m:c.m,t:'M',p:tk,n:sv?1:0});
 lvF(v,c,s,sv?'🧤':'❌',pre+(sv?pick([`<b>Parato!</b> ${lvSur(gk)} intuisce l’angolo e respinge il rigore di ${K}`,`<b>${lvSur(gk)} para il rigore</b> di ${K}!`,`<b>Parato!</b> ${lvSur(gk)} si distende e dice no a ${K}`]):pick([`<b>Rigore sbagliato!</b> ${K} calcia alto sopra la traversa`,`<b>Rigore sbagliato!</b> ${K} colpisce il palo`,`<b>Rigore sbagliato!</b> ${K} apre troppo il piatto: palla a lato`])),'k')}

/* ===== v0.5.5: annata e serie positive/negative, capitano su umore e cartellini, esporta/importa salvataggio =====
   Annata: ogni squadra ha uno stato di forma nascosto per la stagione (t.an, in punti di forza, media 0, dev. std ANS, al massimo ±ANX),
   estratto alla sua prima partita e cancellato a fine stagione. Serie: dai risultati di campionato, modificatore visibile prima della partita.
   Entrambi entrano solo nel confronto fra le due squadre (sim e partita in diretta), non nel valore «Forza XI» mostrato.
   Capitano: con lui in campo i cali di umore si riducono fino al 35% e i cartellini della squadra fino al 20% (in proporzione alla coesione);
   se è scontento (felicità sotto 35) il suo effetto si dimezza. */
const ANS=1.5,ANX=3,XF='calcio-d-inizio',
gss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())},
anOf=t=>{if(!t)return 0;if(t.an==null)t.an=r1(Math.max(-ANX,Math.min(ANX,gss()*ANS)));return t.an},
// serie in campionato, dall'ultima giornata giocata all'indietro: v vittorie, u risultati utili, l sconfitte, s partite senza vittorie
strk=t=>{const o={v:0,u:0,l:0,s:0},l=t&&S.lgs&&S.lgs[t.lg];if(!l||!l.res||!l.fx)return o;let fv=1,fu=1,fl=1,fs=1;
 for(let r=l.res.length-1;r>=0&&(fv||fu||fl||fs);r--){const F=l.fx[r],Q=l.res[r];if(!F||!Q)continue;const i=F.findIndex(m=>m[0]==t.id||m[1]==t.id);if(i<0||!Q[i])continue;const[x,y]=Q[i],g=F[i][0]==t.id?x-y:y-x;

STK=[[5,'v',.8,'📈','vittorie di fila'],[3,'v',.4,'📈','vittorie di fila'],[6,'u',.4,'📈','risultati utili di fila'],[5,'l',-.8,'📉','sconfitte di fila'],[3,'l',-.4,'📉','sconfitte di fila'],[6,'s',-.4,'📉','partite senza vittorie']],

 let fire=V.fire&&S.teams.length>=60?1:0,cr=0,wn=0;if(fire&&f0>=65){fire=0;cr=1}else if(fire&&V.n==1&&!(S.sk>0)){fire=0;wn=1}
 if(wn)S.sk=1;else if(!V.fire)S.sk=0;

 q.v=Object.assign(V,{fire,cr,wn,f0:Math.round(f0),f1:Math.round(f1)});q.mo=obMoodOf(q.rows);return q},

 if(!v.fire&&q.mo)o+=L(`${q.mo>0?'🙂':'🙁'} Umore della rosa: <b>${q.mo>0?'+':''}${q.mo}</b> (${q.mo>0?'obiettivi raggiunti o superati':'obiettivi mancati'})`);return o},
// schermata dell'esonero: finché non scegli un'offerta non si gioca

bmTick=()=>{const w=win();if(!w||S.fx||uEnd())return 0;const l=wl();if(l>2||l<1||(l==2&&BQ))return 0;const k=(S.sn||1)+w.k+l;if(S.bmk===k)return 0;S.bmk=k;
 S.mail.push({id:++S.mid,k:'bm',sn:S.sn,r:S.tu,tx:l==2?'Mister, il mercato '+w.k+' sta per chiudere: dopo la prossima partita sarà l’ultimo giorno utile. Se vuoi rinforzare la rosa o cedere qualcuno in esubero, questo è il momento di muoversi.':'Mister, oggi è l’ultimo giorno di mercato '+w.k+': si chiude dopo la giornata '+w.c+'. Dal pulsante «Ultime ore di mercato» puoi seguire il conto alla rovescia: negli ultimi minuti arrivano offerte e colpi a sorpresa. Poi niente più acquisti né cessioni fino alla prossima finestra.',seen:0});return 1},
vBm=m=>`<div class='card'><div style='display:flex;gap:10px;align-items:center'>${bd(S.teams[S.me],'s')}<div class='gr'><b>La dirigenza</b><small>Mercato in chiusura</small></div></div><p style='margin:8px 0'>${m.tx}</p><div class='pills' style='padding:0'><button class='pb c' onclick='bmOk(${m.id})'>Ricevuto</button></div></div>`,

/* ----- pre-stagione: 4 settimane di mercato prima della prima giornata (senza partite, il calendario non si muove) ----- */

function dlGo(){if(!(win()&&wl()==1&&!uEnd()))return render();const d=dlSt();
 if(!d){S.dm={t:S.tu,h:8};save();render();return toast('⏰ Ultime 8 ore di mercato: da qui può succedere di tutto')}
 d.h=Math.max(0,d.h-1);const h=d.h,l0=S.news[S.news.length-1];
 if(h==0){S.mail=S.mail.filter(m=>m.k!='bm');save();render();return toast('🔴 Il mercato è chiuso')}
 for(let k=0,m=Math.max(1,Math.round(2*WF()));k<m;k++)if(Math.random()<.7)npcBuy();
 const no=mOff(h>=4?.3:.5),nw=S.news[S.news.length-1]!==l0?S.news[S.news.length-1][1]:'';
 save();render();toast(no?'📬 Offerta dell’ultimo minuto: guarda la posta':h==1?'⏰ Ultima ora di mercato!':nw?'⏰ '+nw:'⏰ Mancano '+h+' ore alla chiusura')}
function dlEnd(){if(!(win()&&wl()==1))return render();S.dm={t:S.tu,h:0};S.mail=S.mail.filter(m=>m.k!='bm');save();render();toast('🔴 Il mercato è chiuso')}
/* ----- partita in corso: annulla un cambio finché non riprendi ----- */
function lvUndo(k){const v=ui.lv;if(!v||!v.us||!v.us[k])return;const u=v.us[k],T=v.T[v.me],i=T.x.indexOf(u.inn);if(i<0)return toast('Il cambio non si può più annullare');
 T.x[i]=u.out||null;if(u.out)T.ou=T.ou.filter(q=>q!==u.out);T.en=T.en.filter(q=>q!==u.inn);T.b.splice(u.bi>=0?Math.min(u.bi,T.b.length):T.b.length,0,u.inn);T.ns=Math.max(0,T.ns-1);
 const j=v.feed.indexOf(u.fe);if(j>=0)v.feed.splice(j,1);v.us.splice(k,1);v.sel=null;render()}

// offerte di altri club all'inizio della stagione: dipendono da come è andata
const jobOffers=(rk,pos,mv)=>{const me=S.teams[S.me],out=[];if(S.teams.length<60)return out;
 const cup=Object.values(S.cw||{}).some(a=>{const z=a&&a[a.length-1];return z&&z[0]==S.sn-1&&z[1]==S.me}),sc=Math.max(-8,Math.min(8,rk-pos))+(pos==0?4:0)+(mv=='up'?3:mv=='dn'?-4:0)+(cup?3:0),
 n=S.fx?3:Math.max(0,Math.min(3,Math.round(1+sc/3+(Math.random()-.5)*2)));if(!n)return out;
 const tg=me.f+Math.max(-6,Math.min(8,sc))*.8-(S.fx?2:0),pool=S.teams.filter(t=>t.id!=S.me&&cmOf(t.lg)>0&&Math.abs(t.f-tg)<=(S.fx?10:6)).sort(()=>Math.random()-.5),ch=[];
 pool.forEach(t=>{if(ch.length<n&&!ch.some(x=>x.lg==t.lg))ch.push(t)});pool.forEach(t=>{if(ch.length<n&&!ch.includes(t))ch.push(t)});
 ch.forEach(t=>{S.mail.push({id:++S.mid,k:'jo',tid:t.id,ob:mkOb(t),bud:Math.max(5,Math.round(t.budget)),r:0,sn:S.sn,seen:0});out.push(t.name+' ('+LG[t.lg].k+')')});return out},
vJo=m=>{const t=S.teams[m.tid],me=S.teams[S.me],Lg=LG[t.lg],sim=S.cm[Lg.c]==2,ask=ui.joc==m.id;
 return`<div class='card'><div style='display:flex;gap:10px;align-items:center'>${bd(t,'s')}<div class='gr'><b>${t.name}</b><small>Offerta di lavoro · ${Lg.k}</small></div></div><p style='margin:8px 0'>Il club ti ha contattato: vorrebbe affidarti la panchina per la stagione ${m.sn}. L’offerta vale fino alla prima giornata.</p><div class='bub' style='margin:0 0 8px'>🎯 <b>Obiettivi:</b>${obHtml(m.ob)}💶 <b>Budget:</b> ${fmt(m.bud)} <span class='mu' style='font-size:13px'>(il budget attuale di ${fmt(me.budget)} resta al ${me.name})</span><br>📊 <b>Forza:</b> ${pw(t).toFixed(0)} <span class='mu' style='font-size:13px'>(la tua squadra: ${pw(me).toFixed(0)})</span>${sim?'':'<br><span class="mu" style="font-size:13px">Il campionato è «solo mercato»: diventerebbe simulato.</span>'}</div>${ask?`<p style='margin:0 0 8px'><b>${S.fx?'Accetti la panchina del '+t.name+'?':'Lasci il '+me.name+' per il '+t.name+'?'}</b> Non si torna indietro.</p><div class='pills' style='padding:0'><button class='pb c' onclick='joGo(${m.id})'>Sì, accetto</button><button class='pb' onclick='ui.joc=0;render()'>Annulla</button></div>`:`<div class='pills' style='padding:0'><button class='pb c' onclick='ui.joc=${m.id};render()'>Accetta</button>${S.fx?'':`<button class='pb' onclick='joNo(${m.id})'>Rifiuta</button>`}</div>`}</div>`},
joNo=id=>{S.mail=S.mail.filter(x=>x.id!=id);ui.joc=0;save();render()};
function joGo(id){const m=S.mail.find(x=>x.id==id&&x.k=='jo');if(!m)return;if(S.round>0||S.tu>0){S.mail=S.mail.filter(x=>x!=m);ui.joc=0;save();render();return toast('L’offerta non è più valida')}
 const old=S.teams[S.me],t=S.teams[m.tid],c=LG[t.lg].c;if(S.cm[c]!=2)goSim(c);
 old.mod=0;old.mr=-9;S.me=t.id;S.lg=t.lg;S.rev=revOf(t);S.wx=0;t.budget=m.bud;t.p.forEach(p=>{p.cm=0});
 S.lu={mod:'4-3-3',auto:true,l:[],ag:50,it:50,bc:50};S.sp=0;S.blk={};S.mail=[];S.led=[];S.loans=[];S.ob=Object.assign({},m.ob,{t:t.id,sn:S.sn});S.fid=S.fx?55:Math.round(50+(fidOf()-50)*.5);S.fx=0;S.dm=0;S.sk=0;
 ecSet();cuInit();ecMk();retire();numbers(t);news('🔁 '+(S.av?S.av.n+' '+S.av.sn:'Il mister')+' lascia il '+old.name+' ed è il nuovo allenatore del '+t.name);
 Object.assign(ui,{tab:'club',sel:-1,rep:0,ng:0,sl:0,sr:0,cf:0,np:0,tv:null,cv:'',rs:'pl',sub:'buy',lgf:[],ntf:'',fs:-1,joc:0});save();render();toast('Ora alleni il '+t.name)}
// variazioni di overall dei tuoi giocatori a fine stagione
const ovSec=a=>{if(!a||!a.length)return'';const up=a.filter(x=>x.d>0).sort((x,y)=>y.d-x.d||y.o-x.o),dn=a.filter(x=>x.d<0).sort((x,y)=>x.d-y.d||y.o-x.o),eq=a.filter(x=>!x.d).sort((x,y)=>y.o-x.o),
 m0=a.reduce((s,x)=>s+x.o-x.d,0)/a.length,m1=a.reduce((s,x)=>s+x.o,0)/a.length,
 row=x=>`<div style='display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #0001'><span>${flag(x.nt,14)} ${x.n} <small class='mu'>${x.r} · ${x.a} anni${x.e?' · contratto scaduto':''}</small></span><b style='white-space:nowrap'>${x.o-x.d} → ${x.o} <span style='color:var(--${x.d>0?'win':'lose'})'>(${x.d>0?'+':''}${x.d})</span></b></div>`,
 blk=(t,l)=>l.length?`<div class='sec' style='margin:10px 0 4px'>${t} (${l.length})</div><div class='bub' style='margin:0;padding:4px 12px'>${l.map(row).join('')}</div>`:'';
 return`<div class='sec' style='margin:10px 0 4px'>Variazioni di overall</div><div class='bub' style='margin:0'>Overall medio della rosa: <b>${m0.toFixed(1)} → ${m1.toFixed(1)}</b> · ${up.length} in crescita, ${dn.length} in calo, ${eq.length} invariati.</div>${blk('📈 Cresciuti',up)}${blk('📉 In calo',dn)}${eq.length?`<div class='sec' style='margin:10px 0 4px'>➖ Invariati (${eq.length})</div><div class='bub' style='margin:0'>${eq.map(x=>x.n+' '+x.o).join(' · ')}</div>`:''}`};

i lavoro':'Inizia la stagione '+(q.n+1)} ▶</button></div></div>`};
function render(){document.getElementById("app").innerHTML=ui.scr=="menu"?vMenu():ui.scr=="slot"?vSlot():ui.scr=="av"?vAv():ui.scr=="wld"?vWld():ui.scr=="ed"?vEd():ui.scr=="wm"?vWm():ui.scr=="live"?vLive():ui.scr=="pick"?vPick():ui.scr=="cp"?vCp():S&&S.fx?vFx():vGame();if(document.querySelectorAll)document.querySelectorAll('.pills.sc').forEach(r=>{const a=r.querySelector('.pill.on');if(a){const x=a.getBoundingClientRect(),y=r.getBoundingClientRect();if(x.left<y.left||x.right>y.right-36)r.scrollLeft=Math.max(0,x.left-y.left+r.scrollLeft-12)}});if(ui.scrollNext){ui.scrollNext=0;const e=document.getElementById("nx");if(e)e.scrollIntoView({block:"center"})}}
